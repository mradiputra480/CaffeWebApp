<!DOCTYPE html>
<html lang="id" class="h-full bg-[#1E120A]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeSync — Live App Showcase (GitHub Pages)</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espresso: '#3B2314',
                        darkRoast: '#2A180E',
                        deepBean: '#1E120A',
                        warmAmber: '#D97706',
                        crema: '#FAF2ED',
                        warmSurface: '#FDFBF7'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col bg-[#1E120A] text-white overflow-hidden">

    <!-- Top Live App Control Navigation Bar -->
    <header class="bg-[#2A180E] border-b border-[#3B2314] px-4 py-3 flex-shrink-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <!-- Branding -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#D97706] to-[#B45309] flex items-center justify-center shadow-md">
                    <span class="text-lg">☕</span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-heading font-extrabold text-base tracking-tight text-white leading-none">CafeSync</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#D97706]/20 text-[#D97706] border border-[#D97706]/30 uppercase">
                            GitHub Pages Live App
                        </span>
                    </div>
                    <span class="text-[11px] text-[#FAF2ED]/60 font-medium">Specialty Coffee Multi-Role Platform</span>
                </div>
            </div>

            <!-- Screen Switcher Tabs -->
            <nav class="flex items-center bg-[#1E120A] p-1 rounded-xl border border-white/10 gap-1 text-xs overflow-x-auto max-w-full">
                <button 
                    onclick="switchScreen('pos', this)" 
                    class="nav-tab active-tab px-3 py-1.5 rounded-lg font-semibold transition-all flex items-center gap-1.5 bg-[#D97706] text-white shadow-sm"
                    data-url="./design_mockups/stitch_cafesync_management_platform/cafesync_web_pos_terminal/code.html"
                >
                    <span class="material-symbols-outlined text-[16px]">point_of_sale</span>
                    <span>1. POS Kasir</span>
                </button>

                <button 
                    onclick="switchScreen('analytics', this)" 
                    class="nav-tab px-3 py-1.5 rounded-lg font-medium text-[#FAF2ED]/70 hover:text-white transition-all flex items-center gap-1.5 hover:bg-white/5"
                    data-url="./design_mockups/stitch_cafesync_management_platform/executive_analytics_hr_dashboard/code.html"
                >
                    <span class="material-symbols-outlined text-[16px]">analytics</span>
                    <span>2. Executive Analytics & HR</span>
                </button>

                <button 
                    onclick="switchScreen('inventory', this)" 
                    class="nav-tab px-3 py-1.5 rounded-lg font-medium text-[#FAF2ED]/70 hover:text-white transition-all flex items-center gap-1.5 hover:bg-white/5"
                    data-url="./design_mockups/stitch_cafesync_management_platform/raw_supply_inventory_portal/code.html"
                >
                    <span class="material-symbols-outlined text-[16px]">inventory_2</span>
                    <span>3. Stok Bahan Baku</span>
                </button>

                <button 
                    onclick="switchScreen('login', this)" 
                    class="nav-tab px-3 py-1.5 rounded-lg font-medium text-[#FAF2ED]/70 hover:text-white transition-all flex items-center gap-1.5 hover:bg-white/5"
                    data-url="./design_mockups/stitch_cafesync_management_platform/multi_role_portal_login/code.html"
                >
                    <span class="material-symbols-outlined text-[16px]">lock</span>
                    <span>4. Portal Sign-In</span>
                </button>
            </nav>

            <!-- Actions: Open in Fullscreen / View Code on GitHub -->
            <div class="flex items-center gap-2">
                <a 
                    id="openExternalBtn" 
                    href="./design_mockups/stitch_cafesync_management_platform/cafesync_web_pos_terminal/code.html" 
                    target="_blank" 
                    title="Buka tampilan ini di tab baru"
                    class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-[#FAF2ED] text-xs font-semibold border border-white/10 transition-colors flex items-center gap-1"
                >
                    <span class="material-symbols-outlined text-[16px]">open_in_new</span>
                    <span class="hidden sm:inline">Buka Full</span>
                </a>

                <a 
                    href="https://github.com/mradiputra480/CaffeWebApp" 
                    target="_blank" 
                    class="px-3 py-1.5 rounded-lg bg-[#FAF2ED] hover:bg-white text-[#2A180E] text-xs font-bold transition-all flex items-center gap-1.5 shadow"
                >
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    <span>Source Code</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Viewport (Live Interactive Frame) -->
    <main class="flex-grow w-full h-full relative bg-[#FAF2ED]">
        <iframe 
            id="appViewer" 
            src="./design_mockups/stitch_cafesync_management_platform/cafesync_web_pos_terminal/code.html" 
            class="w-full h-full border-0 block"
            title="CafeSync Live Viewport"
        ></iframe>
    </main>

    <!-- Interactive Switcher Script -->
    <script>
        function switchScreen(key, btn) {
            const viewer = document.getElementById('appViewer');
            const openExternalBtn = document.getElementById('openExternalBtn');
            const targetUrl = btn.getAttribute('data-url');

            // Set iframe src
            viewer.src = targetUrl;
            openExternalBtn.href = targetUrl;

            // Update tab styles
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('bg-[#D97706]', 'text-white', 'shadow-sm', 'active-tab');
                tab.classList.add('text-[#FAF2ED]/70', 'font-medium');
            });

            btn.classList.add('bg-[#D97706]', 'text-white', 'shadow-sm', 'active-tab');
            btn.classList.remove('text-[#FAF2ED]/70', 'font-medium');
        }
    </script>
</body>
</html>
